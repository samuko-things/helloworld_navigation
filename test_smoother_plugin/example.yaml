smoother_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    transform_timeout: 0.1
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "test_smoother_plugin::TestSmoother"
      iterations: 1
      cost_limit: 20
      
      # Laplacian Relaxation Parameters
      w_data: 0.2         # Weight to stay close to original path (range: 0.1 - 0.3)
      w_smooth: 0.3       # Weight to pull toward neighbors / round corners (range: 0.2 - 0.4)
      tolerance: 1e-4     # Convergence threshold (meters)
      max_its: 200        # Max relaxation iterations